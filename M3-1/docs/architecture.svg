<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#081520"/><text x="70" y="78" fill="#f0fafb" font-family="Arial,sans-serif" font-size="35" font-weight="bold">Codyssey M3-1 | AWS Network Architecture</text><text x="70" y="113" fill="#8bafb8" font-family="Arial,sans-serif" font-size="18">Illustrative configuration — replace with actual AWS values before submission</text><rect x="80" y="250" width="185" height="118" rx="16" fill="#173a4f" stroke="#26e3db" stroke-width="2"/><text x="173" y="301" font-family="Arial" text-anchor="middle" fill="white" font-size="23">Internet</text><text x="173" y="330" font-family="Arial" text-anchor="middle" fill="#86dcd8" font-size="17">HTTP :80</text><rect x="310" y="250" width="195" height="118" rx="16" fill="#173a4f" stroke="#26e3db" stroke-width="2"/><text x="407" y="297" font-family="Arial" text-anchor="middle" fill="white" font-size="21">Internet Gateway</text><text x="407" y="329" font-family="Arial" text-anchor="middle" fill="#86dcd8" font-size="17">IGW attached</text><rect x="545" y="160" width="660" height="448" rx="22" fill="#102836" stroke="#3e6474" stroke-width="3"/><text x="575" y="200" fill="#e2f3f7" font-family="Arial" font-size="22">VPC | 10.0.0.0/16 (example)</text><rect x="582" y="242" width="280" height="96" rx="12" fill="#24485a" stroke="#5cb1bd"/><text x="722" y="280" fill="white" text-anchor="middle" font-family="Arial" font-size="20">Public Route Table</text><text x="722" y="310" fill="#adf9ed" text-anchor="middle" font-family="Arial" font-size="18">0.0.0.0/0 → IGW</text><rect x="582" y="385" width="584" height="180" rx="16" fill="#193f4c" stroke="#31d8c1" stroke-width="2"/><text x="610" y="421" fill="white" font-family="Arial" font-size="20">Public Subnet | 10.0.1.0/24</text><rect x="615" y="448" width="236" height="85" rx="10" fill="#295064"/><text x="733" y="479" fill="white" text-anchor="middle" font-family="Arial" font-size="18">Security Group</text><text x="733" y="504" fill="#abf9ee" text-anchor="middle" font-family="Arial" font-size="17">80: all | 22: my IP/32</text><rect x="895" y="448" width="240" height="85" rx="10" fill="#295064"/><text x="1015" y="481" fill="white" text-anchor="middle" font-family="Arial" font-size="20">EC2 + Nginx</text><text x="1015" y="507" fill="#abf9ee" text-anchor="middle" font-family="Arial" font-size="16">Public IPv4 | port 80</text><g fill="none" stroke="#32e8d1" stroke-width="5" stroke-linecap="round"><path d="M265 309 H310"/><path d="M505 309 H555 V488 H615"/><path d="M851 488 H895"/></g><g fill="#32e8d1"><path d="M305 301 L316 309 L305 317"/><path d="M610 480 L621 488 L610 496"/><path d="M890 480 L901 488 L890 496"/></g><path d="M505 272 H582" fill="none" stroke="#9acfd0" stroke-width="2" stroke-dasharray="6 6"/><path d="M721 338 V385" fill="none" stroke="#9acfd0" stroke-width="2" stroke-dasharray="6 6"/><text x="80" y="650" fill="#a5c0c7" font-family="Arial" font-size="19">Flow: External browser → Internet → IGW → Public EC2 (SG allows TCP 80) → Nginx</text><text x="80" y="682" fill="#a5c0c7" font-family="Arial" font-size="17">SSH TCP 22 restricted to administrator IP/32; public subnet route table associated with IGW</text></svg>